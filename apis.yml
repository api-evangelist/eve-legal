aid: eve-legal
name: Eve
description: >-
  Eve (eve.legal) is a legal AI platform built by Butler Labs, Inc. for
  plaintiff law firms. Marketed as "the only legal AI that works your whole
  case with you," Eve 2.0 is positioned as a proactive AI workforce that spans
  the full plaintiff case lifecycle — intake and evaluation, pre-litigation
  drafting (medical chronologies, demand letters), litigation discovery
  (propounding and responding), and case auditing. The platform is organized
  around three product surfaces: Eve Agents (intake & evaluation, AI voice
  agent, medical overviews, demand letters, drafting, propounding discovery,
  responding to discovery), Eve Auditor (nightly audit of the active caseload
  for missed value drivers such as TBIs, MRIs ordered but not taken, and
  mass-tort eligibility), and Eve Analyst (announced as "coming soon"). Eve
  targets personal injury and labor & employment plaintiff firms and claims
  to be used by 1000+ firms with reported outcomes including a 250%
  year-over-year revenue increase, 2.5x case capacity, 90% faster demand
  letter generation, and a 4.9/5 G2 rating. Eve is SOC 2 Type 2 certified and
  HIPAA compliant, with case data encrypted, isolated per-firm, and never
  used to train shared models. The company is led by founder & CEO Jay
  Madheswaran (formerly Rubrik, Lightspeed Venture Partners), co-founder & CPO
  Matt Noe, and co-founder & Head of Engineering David Zeng, and has raised
  $164M+ from venture investors. Eve is a closed B2B SaaS application; as of
  this profile there is no public developer API, no public OpenAPI/AsyncAPI
  documentation, no `docs.eve.legal` developer portal, no SDKs, and no public
  repositories under the `eve-legal` GitHub organization (the org exists with
  zero public repos as of May 2026). All access is through the Eve web
  application following a sales-led "Schedule a call" / "Book a Demo" motion.
